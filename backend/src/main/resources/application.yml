spring:
  application:
    name: sandesh-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: 8080
  error:
    include-message: never     # error bodies come from GlobalExceptionHandler only
    include-stacktrace: never
  compression:
    enabled: true
  forward-headers-strategy: framework
  tomcat:
    # A stream is a held connection. Deliberate rather than defaulted — see docs/PLAN.md §21.
    max-connections: 2000
    threads:
      max: 200

app:
  datasource:
    # This service's own database. JPA and Flyway own it.
    sandesh:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sandesh}
      username: ${DB_USER:sandesh}
      password: ${DB_PASSWORD:sandesh_dev_password}
      maximum-pool-size: 10
      minimum-idle: 2
    # Nirman's, through a role that may only SELECT from the two contract views.
    nirman:
      jdbc-url: jdbc:postgresql://${NIRMAN_DB_HOST:localhost}:${NIRMAN_DB_PORT:5432}/${NIRMAN_DB_NAME:nirman}
      username: ${NIRMAN_DB_USER:chat_reader}
      password: ${NIRMAN_DB_PASSWORD:chat_reader_dev_password}
      maximum-pool-size: 5
      minimum-idle: 1
      read-only: true
  jwt:
    # The same secret Nirman signs with. Sandesh only ever verifies.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:nirman}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  stream:
    # How long a single SSE connection is held before the client is asked to reconnect. Short
    # enough that a token refresh lands on a fresh authorisation snapshot.
    max-minutes: 10
    heartbeat-seconds: 25
  outbox:
    # Anything nobody collects in a week is destroyed. The TTL is the retention policy.
    sweep-after-days: 7
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:sandesh_minio}
    secret-key: ${STORAGE_SECRET_KEY:sandesh_minio_dev_password}
    bucket: ${STORAGE_BUCKET:sandesh-media}
    signed-url-minutes: 10
    max-file-size-bytes: 26214400
    allowed-content-types: image/jpeg,image/png,image/webp

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
  level:
    in.sandesh: INFO
