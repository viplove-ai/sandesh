spring:
  application:
    name: sandesh-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Unqualified entity tables resolve here. Nirman's views are reached with an explicit
        # `public.` prefix instead, so nothing of ours can accidentally read or write there.
        default_schema: sandesh
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Sandesh's migrations run inside their own schema and keep their own history table there,
    # so they never see Nirman's and Nirman's never sees these. Sharing a database is only safe
    # because of this line; without it two Flyway histories collide in `public` and each
    # service decides the other has applied migrations out of order.
    schemas: sandesh
    default-schema: sandesh
    create-schemas: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: 8080
  error:
    include-message: never     # error bodies come from GlobalExceptionHandler only
    include-stacktrace: never
  compression:
    enabled: true
  forward-headers-strategy: framework
  tomcat:
    # A stream is a held connection. Deliberate rather than defaulted — see docs/PLAN.md §21.
    max-connections: 2000
    threads:
      max: 200

app:
  timezone: Asia/Kolkata
  push:
    # Blank keys switch push off rather than failing at startup: the pilot has to be able to run
    # before somebody has generated a pair, and a service that will not boot without one cannot
    # be tried. Generate with:  npx web-push generate-vapid-keys
    enabled: ${PUSH_ENABLED:true}
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    # Required by the spec and enforced by Apple's endpoint in particular.
    subject: ${VAPID_SUBJECT:mailto:admin@example.com}
  datasource:
    # Nirman's database. Sandesh owns the `sandesh` schema inside it and reads two views in
    # `public`; it writes nothing outside its own schema.
    jdbc-url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nirman}
    username: ${DB_USER:nirman}
    password: ${DB_PASSWORD:nirman_dev_password}
    maximum-pool-size: 10
    minimum-idle: 2
  jwt:
    # The same secret Nirman signs with. Sandesh only ever verifies.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:nirman}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  stream:
    # How long a single SSE connection is held before the client is asked to reconnect. Short
    # enough that a token refresh lands on a fresh authorisation snapshot.
    max-minutes: 10
    heartbeat-seconds: 25
  system:
    # What Nirman presents when it posts an actionable card. Blank disables the endpoint outright
    # rather than accepting an empty token — a misconfigured deployment should refuse the call,
    # not accept everybody's. At least 32 characters.
    token: ${SYSTEM_TOKEN:}
  retention:
    # OFF, and that is a decision rather than caution. Keeping the work channels needs a stated
    # purpose, a stated window and language in the employment contract before the first retained
    # message exists — none of which is engineering's to supply, and shipping this enabled would
    # make the legal position a consequence of a deploy. See docs/PLAN.md §15.
    enabled: ${RETENTION_ENABLED:false}
    # Three years is a placeholder. The real number follows the contract's arbitration window,
    # which is why it is configuration and not a constant.
    window-days: ${RETENTION_WINDOW_DAYS:1095}
  outbox:
    # Anything nobody collects in a week is destroyed. The TTL is the retention policy.
    sweep-after-days: 7
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:sandesh_minio}
    secret-key: ${STORAGE_SECRET_KEY:sandesh_minio_dev_password}
    bucket: ${STORAGE_BUCKET:sandesh-media}
    signed-url-minutes: 10
    max-file-size-bytes: 26214400
    # Images and the document kinds a site actually exchanges. Every one of these has a magic
    # number ContentTypeSniffer can check, which is the point — an allow-list of labels is not
    # an allow-list of files.
    allowed-content-types: >-
      image/jpeg,image/png,image/webp,application/pdf,
      application/vnd.openxmlformats-officedocument.wordprocessingml.document,
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
      application/vnd.openxmlformats-officedocument.presentationml.presentation

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
  level:
    in.sandesh: INFO
