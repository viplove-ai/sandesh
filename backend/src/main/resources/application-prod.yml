# Production profile. Everything sensitive comes from the environment; on Fly those are set
# with `flyctl secrets set` and never in fly.toml, which is committed and public.

app:
  datasource:
    # A managed Postgres hands you one connection string including sslmode, so take it whole
    # rather than rebuilding it from host and port the way the default profile does.
    jdbc-url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    # Neon's free tier caps connections well below the default, and Nirman is using the same
    # cluster — this service is a relay and does not need to compete for them.
    maximum-pool-size: 6
    minimum-idle: 1
  api-docs:
    # A complete map of the API. Development wants it; a deployment carrying one contractor's
    # conversations does not publish it.
    public: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    in.sandesh: INFO
