# Fly.io config for the Sandesh API.
# Secrets (JWT_SECRET, DATABASE_URL, DB_*, STORAGE_*) are set with `fly secrets set`, never
# here — this file is committed and the repo is public.

app = "sandesh-api"
primary_region = "sin"   # Same region as nirman-constructions-api: this service reads Nirman's
                         # contract views on every connect, and that hop should be short.

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  # Tigris, the same S3 endpoint Nirman uses. The bucket differs, the credentials differ.
  STORAGE_ENDPOINT = "https://fly.storage.tigris.dev"
  JAVA_OPTS = "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Never suspend. This process holds open event streams, and suspending drops every one of
  # them — which the clients survive, but a reconnect storm every idle period is not free.
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    # 120s, not 45. Flyway runs before the port opens, and on a shared CPU the JVM needs most of
    # a minute before it even reaches that — the first deploy spent 97 seconds in context
    # initialisation alone. A grace period shorter than the real cold start turns every slow
    # boot into a ten-minute health-check timeout that says nothing about the cause.
    grace_period = "120s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  # 1gb, matching Nirman. 512mb looked reasonable for a relay and was not: the first deploy
  # spent 97 seconds initialising the Spring context, which is a JVM thrashing rather than a
  # JVM working. Hibernate and the two connection pools cost what they cost.
  memory = "1gb"
