<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EDE8DC;display:flex;flex-wrap:wrap;gap:24px;padding:24px;font-family:"IBM Plex Sans",sans-serif}
  .tile{position:relative;display:grid;place-items:center;overflow:hidden}
  .glyph{font-family:Kalam,cursive;font-weight:700;line-height:1;color:#14181D}
  .bar{position:absolute;background:#C2410C;border-radius:3px}
</style></head>
<body>
  <div id="icon" class="tile" style="width:512px;height:512px;background:#F7F3E9;border:26px solid #14181D;border-radius:112px 80px 128px 88px/88px 128px 80px 112px;box-sizing:border-box">
    <span class="glyph" style="font-size:296px;margin:-44px 22px 0 0">स</span>
    <span class="bar" style="left:112px;right:112px;bottom:104px;height:17px"></span>
  </div>

  <div id="maskable" class="tile" style="width:512px;height:512px;background:#C2410C">
    <span class="glyph" style="font-size:232px;color:#FFFDF7;margin:-34px 17px 0 0">स</span>
    <span class="bar" style="left:176px;right:176px;bottom:136px;height:13px;background:#FFFDF7;opacity:.9"></span>
  </div>

  <div id="favicon" class="tile" style="width:512px;height:512px;background:#F7F3E9;border:36px solid #14181D;border-radius:104px;box-sizing:border-box">
    <span class="glyph" style="font-size:348px;margin:-44px 26px 0 0">स</span>
    <span class="bar" style="left:104px;right:104px;bottom:74px;height:24px"></span>
  </div>

  <div id="lockup" style="flex:none;width:max-content;display:flex;align-items:center;gap:26px;padding:28px 34px;background:#FFFDF7">
    <div class="tile" style="width:104px;height:104px;background:#F7F3E9;border:5.4px solid #14181D;border-radius:23px 16px 26px 18px/18px 26px 16px 23px;box-sizing:border-box">
      <span class="glyph" style="font-size:58px;margin:-9px 4px 0 0">स</span>
      <span class="bar" style="left:24px;right:24px;bottom:20px;height:3.4px"></span>
    </div>
    <div>
      <div style="font-family:Kalam,cursive;font-weight:700;font-size:56px;line-height:1;color:#14181D">Sandesh</div>
      <div style="font-weight:600;font-size:19px;letter-spacing:.22em;color:#C2410C;margin-top:7px">BY NIRMAN</div>
    </div>
  </div>
</body></html>
